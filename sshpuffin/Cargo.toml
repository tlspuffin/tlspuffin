[package]
name = "sshpuffin"
description = "SSH protocol implementation for fuzzing with tlspuffin"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["sancov"]

# libafl's coverage feedback (puffin/sancov). Without it, the vendors build.rs builds when the vendor
# directory has none are built without sancov. There are no `asan`, `gcov` or `llvm_cov` features,
# as in tlspuffin: a PUT has the instrumentation of its vendor build, and puffin-build adds the link
# flags it needs.
sancov  = ["puffin/sancov"]

[dependencies]
puffin       = { path = "../puffin" }
puffin-build = { path = "../puffin-build" }
extractable-macro = { path = "../extractable-macro" }
log          = { workspace = true }
serde        = { workspace = true, features = ["derive"] }
comparable   = { workspace = true, features = ["derive"] }
libc         = { workspace = true }
once_cell    = { workspace = true }

# Crypto primitives for SSH key exchange, derivation, and packet encryption
x25519-dalek  = { version = "2", features = ["static_secrets"] }
sha2          = "0.10"
chacha20      = "0.9"
poly1305      = "0.8"
aes-gcm       = "0.10"
aes           = "0.8"
ctr           = "0.9"
hmac          = "0.12"
signature     = "2"
rsa           = { version = "0.9", features = ["sha2"] }
ssh-key       = { version = "0.6", features = ["rsa", "std"] }

[dev-dependencies]
env_logger = { workspace = true }
test-log   = { workspace = true }

[build-dependencies]
puffin-build = { path = "../puffin-build" }
bindgen      = { workspace = true }

# the catalogue test generates its tests at run time (one per witness and PUT)
[[test]]
name = "catalogue"
harness = false
