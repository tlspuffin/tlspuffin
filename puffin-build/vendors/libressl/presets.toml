# The builds of LibreSSL: one per version below, and the aliases. Any other build is named with
# modifiers (libressl:4.2.1,asan, libressl421-asan: `mk_vendor modifiers libressl`, puffin-build/README.md).
format = 2

[library]
url = "https://cdn.openbsd.org/pub/OpenBSD/LibreSSL/libressl-{version}.tar.gz"
builder = "libressl"

[versions]
"3.3.3" = { hash = "sha256:a471565b36ccd1a70d0bd7d37c6e95c43a26a62829b487d9d2cdebfe58be3066" }
"4.2.1" = { hash = "sha256:6d5c2f58583588ea791f4c8645004071d00dfa554a5bf788a006ca1eb5abd70b" }

[modifiers]
asan = { default = false, doc = "AddressSanitizer: memory errors abort with a report (about 2x slower)" }
sancov = { default = true, doc = "SanitizerCoverage: the edge coverage the fuzzer's feedback reads" }
gcov = { default = false, doc = "gcov counters, to measure coverage (a build that is not fuzzed: implies no-sancov)" }
llvm_cov = { default = false, doc = "LLVM source-based coverage counters, to measure coverage" }
