# The builds of OpenSSL: one per version below, and the aliases. Any other build is named with
# modifiers (openssl:1.1.1j,asan, openssl111j-asan: `mk_vendor modifiers openssl`, puffin-build/README.md).
format = 2

[library]
repo = "https://github.com/openssl/openssl.git"
builder = "openssl"
ref = [
  { versions = "< 3.0.0", ref = "OpenSSL_{version_}" },
  { versions = ">= 3.0.0", ref = "openssl-{version}" },
]

[versions]
"1.0.1f" = {}
"1.0.2u" = {}
"1.1.1j" = {}
"1.1.1k" = {}
"1.1.1u" = {}
"3.1.2" = {}
"3.2.0" = {}
"3.4.0" = {}
"3.4.1" = {}

[modifiers]
asan = { default = false, doc = "AddressSanitizer: memory errors abort with a report (about 2x slower)" }
sancov = { default = true, doc = "SanitizerCoverage: the edge coverage the fuzzer's feedback reads" }
gcov = { default = false, doc = "gcov counters, to measure coverage (a build that is not fuzzed: implies no-sancov)" }
llvm_cov = { default = false, doc = "LLVM source-based coverage counters, to measure coverage" }
