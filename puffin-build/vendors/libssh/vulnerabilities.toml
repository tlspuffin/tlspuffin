# Known vulnerabilities of libssh.
#
# Format: puffin-build/README.md, section "Vulnerability catalogue". Each entry has a witness
# (`#[puffin::witness("<ID>")]`, sshpuffin/src/ssh/vulnerabilities.rs) or a `no_witness` reason; the
# catalogue test (`cargo test -p sshpuffin --test catalogue`) checks each witness against its oracle.

[CVE-2023-1667]
summary = "libssh server NULL-pointer dereference during rekeying with key-exchange algorithm guessing: an authenticated client that starts a rekey with a KEXINIT whose first_kex_packet_follows flag is set drives the server to dereference a NULL kex-methods pointer and crash (denial of service)"
category = "dos"
cwe = "CWE-476"
cvss = { version = "3.1", score = 6.5, vector = "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H", source = "nvd" }
# Fixed in both 0.9.7 and 0.10.5, so two affected branches. The 0.9.x branch is confirmed
# empirically: on the libssh095 build added for CVE-2021-3634 the witness crashes with the
# identical __strchr_evex < cmp_first_kex_algo < ssh_packet_kexinit stack.
affected = ">= 0.9.1, < 0.9.7 || >= 0.10.0, < 0.10.5"
oracle = { kind = "crash", asan = "SEGV" }
references = [
    "https://nvd.nist.gov/vuln/detail/CVE-2023-1667",
    "https://www.libssh.org/security/advisories/CVE-2023-1667.txt",
    "https://gitlab.com/libssh/libssh-mirror/-/commit/fc1a8bb4555624f85ba1370721ad2086a4feff8c",
]
[CVE-2023-1667.find]
by_puffin = false

[[CVE-2023-1667.patches]]
# The same upstream guard applies verbatim to the 0.9 branch (identical cmp_first_kex_algo
# block; only the line number differs). 0.9.7 and 0.10.5 carry it as the release fix.
versions = ">= 0.9.1, < 0.9.7 || >= 0.10.0, < 0.10.5"
files = ["patches/fix-CVE-2023-1667.patch"]
upstream = "https://gitlab.com/libssh/libssh-mirror/-/commit/fc1a8bb4555624f85ba1370721ad2086a4feff8c"

[CVE-2021-3634]
summary = "libssh heap buffer over-read/over-write when a key re-exchange (rekey) negotiates a key-exchange method whose hash digest differs in size from the first exchange: session_id and the secret hash shared one length field (digest_len), so the carried-over session_id buffer (sized at the first KEX) is read/written with the new, larger digest length in ssh_packet_set_newkeys and crypto_free, crashing the peer (denial of service)"
category = "dos"
cwe = "CWE-787"
cvss = { version = "3.1", score = 6.5, vector = "CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:U/C:N/I:N/A:H", source = "nvd" }
affected = ">= 0.9.1, < 0.9.6"
oracle = { kind = "crash", asan = "heap-buffer-overflow" }
references = [
    "https://nvd.nist.gov/vuln/detail/CVE-2021-3634",
    "https://www.libssh.org/security/advisories/CVE-2021-3634.txt",
    "https://gitlab.com/libssh/libssh-mirror/-/commit/d3060bc84ed4e160082e819b4d404f76df7c8063",
]
[CVE-2021-3634.find]
by_puffin = false

[[CVE-2021-3634.patches]]
versions = ">= 0.9.1, < 0.9.6"
files = ["patches/fix-CVE-2021-3634.patch"]
upstream = "https://gitlab.com/libssh/libssh-mirror/-/commit/d3060bc84ed4e160082e819b4d404f76df7c8063"
