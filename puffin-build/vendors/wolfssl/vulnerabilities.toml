# Known vulnerabilities of wolfSSL: the only source of what builds, tests and the bench know about them.
#
# Format: puffin-build/README.md, section "Vulnerability catalogue". Each entry needs a witness trace in tlspuffin
# (`#[puffin::witness("<ID>")]`, tlspuffin/src/tls/vulnerabilities.rs) or a `no_witness` reason; the catalogue test
# (`cargo test -p tlspuffin --features cputs --test catalogue`) checks each witness against its oracle with and without
# the patch.
#
# CVSS: NVD's CVSS v3.1 base score, NIST's primary assessment (nvd.nist.gov, read on 2026-11-09).
# Patch ranges: the releases on which `git apply --check` succeeds (checked on 4.3.0 to 5.8.4, 2026-11-09); an affected
# release outside them has no patch yet.
# find.by_puffin: first found by tlspuffin ("Novel" in the README's table of CVEs).

[CVE-2022-25638]
alias = "SIG"
summary = "TLS 1.3 server accepts a client CertificateVerify whose signature algorithm differs from the certificate's: client authentication bypass"
category = "auth-bypass"
cwe = "CWE-295"
cvss = { version = "3.1", score = 6.5, vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:U/C:N/I:H/A:N", source = "nvd" }
affected = "< 5.2.0"
capabilities = ["tls13", "client_authentication_transcript_extraction"]
oracle = { kind = "claim", violation = "Authentication bypass" }
references = ["https://nvd.nist.gov/vuln/detail/CVE-2022-25638", "https://github.com/wolfSSL/wolfssl/pull/4813"]

[CVE-2022-25638.find]
by_puffin = false

[[CVE-2022-25638.patches]]
versions = ">= 5.1.0, < 5.2.0"
files = ["patches/fix-CVE-2022-25638.patch"]
upstream = "https://github.com/wolfSSL/wolfssl/pull/4813"

