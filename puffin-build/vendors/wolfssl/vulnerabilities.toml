[CVE-2022-42905]
alias = "HEAP"
summary = "with WOLFSSL_CALLBACKS, AddPacketInfo reads the record header 5 bytes before a heap input buffer holding a handshake record over 16 KB"
category = "memory"
cwe = "CWE-125"
cvss = { version = "3.1", score = 9.1, vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:H", source = "nvd" }
affected = "< 5.5.2"
capabilities = ["tls13"]
oracle = { kind = "crash", asan = "heap-buffer-overflow" }
top_frames = ["AddPacketInfo", "DoTls13HandShakeMsgType"]
# the witness sends a record of about 17 KB: 4.4.0, 5.1.1 and 5.3.0 refuse it ("malformed buffer input") before the bug
witness_versions = ">= 5.4.0"
references = ["https://nvd.nist.gov/vuln/detail/CVE-2022-42905", "https://github.com/wolfSSL/wolfssl/releases/tag/v5.5.2-stable"]

[CVE-2022-42905.find]
by_puffin = true
asan = true

[[CVE-2022-42905.patches]]
versions = ">= 5.4.0, < 5.5.0"
files = ["patches/fix-CVE-2022-42905.patch"]
upstream = "f19e7daf5b60e253042600424c18d008c526d828"

[CVE-2023-6936]
alias = "CALLB"
summary = "a TLS 1.3 peer built with WOLFSSL_CALLBACKS reads 5 bytes past a received handshake message of fewer than 123 bytes (AddPacketInfo copies it from lateRL bytes past its start), e.g. a fragmented ClientHello"
category = "memory"
cwe = "CWE-125"
cvss = { version = "3.1", score = 9.1, vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:H", source = "nvd" }
# NVD gives before 5.6.6; the over-read of this code comes with the fix of CVE-2022-42905 (HEAP) in 5.5.2, before
# which the same function had HEAP's
affected = ">= 5.5.2, < 5.6.6"
capabilities = ["tls13"]
oracle = { kind = "crash", asan = "heap-buffer-overflow" }
top_frames = ["AddPacketInfo", "DoTls13HandShakeMsgType"]
no_witness = "no witness trace in tlspuffin: its finds are validated by patch differential (its patch), without the controls of a witness"
references = ["https://nvd.nist.gov/vuln/detail/CVE-2023-6936", "https://github.com/wolfSSL/wolfssl/pull/6949"]

[CVE-2023-6936.find]
by_puffin = true
asan = true

[[CVE-2023-6936.patches]]
versions = ">= 5.5.2, < 5.6.6"
files = ["patches/fix-CVE-2023-6936.patch"]
upstream = "9d632ccaa653d7d1b2f73b4f0085ab2689fceef9"

