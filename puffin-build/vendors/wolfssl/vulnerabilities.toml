[CVE-2022-38152]
alias = "SDOS2"
summary = "server reusing its session with wolfSSL_clear crashes (NULL dereference) on a TLS 1.3 resumption ClientHello"
category = "dos"
cwe = "CWE-754"
cvss = { version = "3.1", score = 7.5, vector = "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H", source = "nvd" }
affected = "< 5.5.0"
requires = { postauth = false }
capabilities = ["tls13", "tls13_session_resumption"]
put_options = { use_clear = "true" }
oracle = { kind = "crash", asan = "SEGV" }
references = ["https://nvd.nist.gov/vuln/detail/CVE-2022-38152", "https://github.com/wolfSSL/wolfssl/pull/5468"]

[CVE-2022-38152.find]
by_puffin = true
flags = ["--put-use-clear"]

[[CVE-2022-38152.patches]]
versions = ">= 5.4.0, < 5.5.0"
files = ["patches/fix-CVE-2022-38152.patch"]
upstream = "https://github.com/wolfSSL/wolfssl/pull/5468"

[CVE-2022-38153]
alias = "CDOS"
summary = "TLS 1.2 client with a non-empty session cache frees an invalid pointer on a NewSessionTicket with a ticket over 256 bytes"
category = "dos"
cwe = "CWE-770"
cvss = { version = "3.1", score = 5.9, vector = "CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:N/I:N/A:H", source = "nvd" }
affected = "= 5.3.0"
capabilities = ["tls12", "tls12_session_resumption"]
# the crash needs session cache contents left by earlier handshakes: an objective found by fuzzing does not crash
# again on its own (the witness first fills the cache)
replayable = false
oracle = { kind = "crash", asan = "bad-free" }
references = ["https://nvd.nist.gov/vuln/detail/CVE-2022-38153", "https://github.com/wolfSSL/wolfssl/pull/5476"]

[CVE-2022-38153.find]
by_puffin = true

[[CVE-2022-38153.patches]]
versions = "= 5.3.0"
files = ["patches/fix-CVE-2022-38153.patch"]
upstream = "https://github.com/wolfSSL/wolfssl/pull/5476"

