# The builds of wolfSSL: one per version below, and the aliases. Any other build is named with
# modifiers (wolfssl:5.4.0,asan, wolfssl540-asan, wolfssl:5.4.0,only-BUF: `mk_vendor modifiers wolfssl`, puffin-build/README.md).
format = 2

[library]
repo = "https://github.com/wolfSSL/wolfssl.git"
builder = "wolfssl"
ref = "v{version}-stable"

[versions]
"4.3.0" = {}
"4.4.0" = {}
"5.0.0" = {}
"5.1.0" = {}
"5.1.1" = {}
"5.2.0" = {}
"5.3.0" = {}
"5.4.0" = {}
"5.5.2" = {}
"5.7.2" = {}
"5.8.0" = {}
"5.8.4" = {}
"master" = { ref = "master" }

[modifiers]
asan = { default = false, doc = "AddressSanitizer: memory errors abort with a report (about 2x slower)" }
sancov = { default = true, doc = "SanitizerCoverage: the edge coverage the fuzzer's feedback reads" }
gcov = { default = false, doc = "gcov counters, to measure coverage (a build that is not fuzzed: implies no-sancov)" }
llvm_cov = { default = false, doc = "LLVM source-based coverage counters, to measure coverage" }
postauth = { default = true, doc = "--enable-postauth (off: the build of CVE-2022-38152, SDOS2)" }

# The builds of the Vuln benchmarks (group A and B) and of Perf, by the names their history has.
[aliases]
wolfssl510-sig = "5.1.0,fix-CVE-2022-25640+CVE-2022-39173"
wolfssl510-skip = "5.1.0,fix-CVE-2022-25638+CVE-2022-39173"
wolfssl530-cdos = "5.3.0,fix-CVE-2022-39173"
wolfssl540-asan-perf = "5.4.0,asan,fix-CVE-2022-39173+CVE-2022-42905"
wolfssl540-buf = "5.4.0,fix-CVE-2022-42905"
wolfssl540-heap = "5.4.0,asan,fix-CVE-2022-39173"
wolfssl540-perf = "5.4.0,fix-CVE-2022-39173+CVE-2022-42905"
wolfssl540-sdos2 = "5.4.0,no-postauth,fix-CVE-2022-39173"

# Claims instrumentation: from 5.5.0 on, AddPacketInfo skips the message callback for encrypted
# records, so the claims of encrypted handshake messages were never reported. These patches remove
# that check (instrumentation for tlspuffin's security oracle, not a bug fix). master is newer than
# every release: it takes the 5.5.2 one.
[[patches]]
versions = ">= 5.5.0, < 5.5.2"
files = ["patches/claims-AllowClaim-550.patch"]
why = "claims instrumentation: report the claims of encrypted handshake messages (AddPacketInfo)"

[[patches]]
versions = ">= 5.5.2"
files = ["patches/claims-AllowClaim-552.patch"]
why = "claims instrumentation: report the claims of encrypted handshake messages (AddPacketInfo)"
