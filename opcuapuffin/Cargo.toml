[package]
name = "opcuapuffin"
description = "OPC UA protocol implementation for fuzzing with puffin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["sancov", "introspection"]
rust-put = []

# Uses libafl for the instrumentation. sancov_pcguard_log and sancov are mutually exclusive
sancov = ["puffin/sancov"]
gcov = []

# Force to check for new vendors before building
watch-vendor = ["puffin-build/watch-vendor"]
# Debug mode and panic when internal errors occur, instead of logging and skipping
# debug = ["puffin/debug"]
introspection = ["puffin/introspection"]

[dependencies]
base64 = "0.21"
bitflags = "2.4"
byteorder = "1.4"
chrono = { version = "0.4.38", features = ["serde"] }
hashbrown = "^0.15"
lazy_static = "1.5.0"
libc = { workspace = true }
log = { workspace = true }
puffin = { path = "../puffin" }
puffin-macros = { path = "../puffin-macros" }
opcua = { path = "../crates/opcua-mapper/lib" }
serde = { workspace = true, features = ["derive"] }
uuid = { version = "1.2", features = ["v4"] }


[build-dependencies]
bindgen = { workspace = true }
itertools = { workspace = true }
puffin-build = { path = "../puffin-build" }


[[bin]]
name = "opcuapuffin"
path = "src/main.rs"