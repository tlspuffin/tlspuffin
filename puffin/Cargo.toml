[package]
name = "puffin"
description = "Generic APIs for protocol fuzzing with tlspuffin"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# Logs each execution of __sanitizer_cov_trace_pc_guard*
sancov_pcguard_log = []
# Uses libafl for the instrumentation. sancov_pcguard_log and sancov are mutally exclusive
sancov = ["libafl_targets/sancov_pcguard_hitcounts"]
asan = []
# Debug mode and panic when internal errors occur, instead of logging and skipping
debug = []
# Use IndexesLenTimeMinimizerScheduler instead of RandScheduler
with-min-scheduler = []

introspection = ["libafl/introspection"]

# Add feedback type  to review trace
with-claim-fdb = []
with-claim-profile-fdb = []
with-term-fdb = []  
with-semantic-edge-fdb = []
with-depth-fdb = []
without-code-cover-fdb = []

# Options to disable part of differential fuzzing, used to do ablation studies
ddyf-disable-status = []
ddyf-disable-claims = []
ddyf-disable-knowledges = []
ddyf-disable-decryption = []

[dependencies]

puffin-build = { path = "../puffin-build" }

# LibAFL
libafl = { version = "0.15.4", features = ["introspection", "prelude", "tui_monitor"] }
libafl_targets = "0.15.4"
libafl_bolts = { version = "0.15.4", features = ["prelude"] }

# LibAFL/Fuzzer
ahash = "0.8.11"
postcard = { version = "*", features = ["alloc"] }

# Logging
log = { workspace = true }
log4rs = { workspace = true }

# Other Dependencies
libc = { workspace = true }
clap = { workspace = true, features = ["cargo", "string"] }
rand = { workspace = true }
dyn-clone = { workspace = true }
serde = { workspace = true, features = ["derive"] }
once_cell = { workspace = true }
chrono = { workspace = true }
cfg-if = { workspace = true }
itertools = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true, features = ["process", "signal"] }
signal-hook = { workspace = true, features = ["iterator", "extended-siginfo"] }
comparable = { workspace = true, features = ["derive"] }
derivative = { workspace = true }
paste = { workspace = true }

[build-dependencies]
bindgen = { workspace = true }
cc = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }
env_logger = { workspace = true }
