[package]
name = "tlspuffin"
description = "TLS protocol implementation for fuzzing with tlspuffin"
version.workspace = true
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["sancov", "introspection"]

# Tracks vendor directory for auto rebuild if a CPUT has been built or deleted
watch-vendor = ["puffin-build/watch-vendor"]

# Builds and links the harnesses (CPUTs) of every vendor library found in the vendor directory
cputs = []

# Logs each execution of __sanitizer_cov_trace_pc_guard*
sancov_pcguard_log = ["puffin/sancov_pcguard_log"]
# Uses libafl for the instrumentation. sancov_pcguard_log and sancov are mutally exclusive
sancov = ["puffin/sancov"]
# Debug mode and panic when internal errors occur, instead of logging and skipping
debug = ["puffin/debug"]

introspection = ["puffin/introspection"]
# Use IndexesLenTimeMinimizerScheduler instead of RandScheduler
with-min-scheduler = ["puffin/with-min-scheduler"]

# Enable rustls guards rejecting ill-formed messages, those were disabled by default to allow the fuzzer to explore more messages
enable-guards = []

# utility functions for testing tlspuffin
test-utils = ["tempfile"]

# Options to disable part of differential fuzzing, used to do ablation studies
ddyf-disable-status = ["puffin/ddyf-disable-status"]
ddyf-disable-claims = ["puffin/ddyf-disable-claims"]
ddyf-disable-knowledges = ["puffin/ddyf-disable-knowledges"]
ddyf-disable-decryption = ["puffin/ddyf-disable-decryption"]

[dependencies]

puffin = { path = "../puffin" }
puffin-macros = { path = "../puffin-macros" }
extractable-macro = { path = "../extractable-macro" }

log = { workspace = true }
#features = ["release_max_level_off", "max_level_warn"]
itertools = { workspace = true }
libc = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
smallvec = { workspace = true }
once_cell = { workspace = true }
comparable = { workspace = true, features = ["derive"] }

ring = { version = "0.16.20", features = ["std"] }
webpki = { version = "0.22.0", features = ["alloc", "std"] }
sct = "0.7.0"

security-claims = { path = "../tlspuffin-claims", version = "0.1.0", optional = false }

tempfile = { workspace = true, optional = true }
puffin-build = { path = "../puffin-build" }

[build-dependencies]
puffin-build = { path = "../puffin-build" }
itertools = { workspace = true }
bindgen = { workspace = true }

[dev-dependencies]
test-log = { workspace = true }
env_logger = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }

# NOTE force `test-utils` feature in tests/benchmarks/examples
tlspuffin = { path = ".", default-features = false, features = ["test-utils"] }

[[bench]]
name = "benchmark"
harness = false

[[bin]]
name = "tlspuffin"
path = "src/main.rs"
