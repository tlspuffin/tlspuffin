name: run-validation

on:
  workflow_call:
    inputs:
      profile: # one of ['none', 'fast', 'full']
        type: string
        required: true

permissions:
  contents: read
  checks: write # the catalogue overlap check runs

jobs:
  configure:
    runs-on: ubuntu-22.04
    outputs:
      checks: ${{ steps.configure-checks.outputs.checks }}
      matrix: ${{ steps.configure-checks.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: configure-checks
        name: Configure Validation
        run: |
          #!/usr/bin/env bash
          case "${{ inputs.profile }}" in
            none)
              CI_CHECKS=()
              CI_MATRIX="[]"
              ;;
            fast)
              CI_CHECKS=$(jq -c -n '[ "check", "unit", "cli", "docs", "test" ]')
              CI_MATRIX=$(jq -c 'map(select( .labels[] | contains("fast") ))' .github/tlspuffin.matrix.json)
              ;;
            full)
              CI_CHECKS=$(jq -c -n '[ "check", "unit", "cli", "docs", "test", "benchmark" ]')
              CI_MATRIX=$(jq -c '.' .github/tlspuffin.matrix.json)
              ;;
            *)
              printf "error: unknown validation profile '%s'\n" "${{ inputs.profile }}"
              exit 1
              ;;
          esac

          printf 'checks=%s\n' "${CI_CHECKS}" >> "${GITHUB_OUTPUT}"
          printf 'matrix=%s\n' "${CI_MATRIX}" >> "${GITHUB_OUTPUT}"

      - id: print-configuration
        name: Display Configuration
        run: |
          #!/usr/bin/env bash
          printf 'Finished configuration job:\n'
          printf '  - received validation profile: %s\n' '${{ inputs.profile }}'
          printf '  - selected validation checks:\n'
          for check in $(jq -r '.[] | @sh' <(printf "%s" '${{ steps.configure-checks.outputs.checks }}') | tr -d \'\"); do
            printf '    - %s\n' "${check}"
          done
          printf '  - selected test configurations:\n'
          for conf in $(jq -r '.[].name | @sh' <(printf "%s" '${{ steps.configure-checks.outputs.matrix }}') | tr -d \'\"); do
            printf '    - %s\n' "${conf}"
          done

  # the presets the vulnerability catalogue is checked on, with their validation sets, generated from the catalogue: a
  # new entry or patch range adds its checks by itself
  configure-catalogue:
    needs: [configure]
    if: ${{ inputs.profile != 'none' }}
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.catalogue-matrix.outputs.matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - id: catalogue-matrix
        name: catalogue checks
        run: |
          #!/usr/bin/env bash
          set -o pipefail
          matrix=$(just run cargo run --quiet -p puffin-build --bin mk_vendor -- list --check --json | jq -c '.')
          printf 'matrix=%s\n' "${matrix}" >> "${GITHUB_OUTPUT}"
          jq -r '.[] | "  - " + .vendor + ":" + .preset + " (" + (.entries | join(", ")) + "): " + (.builds | join(" "))' <<< "${matrix}"

  # every entry has a witness (or says why not) and every witness names an entry: no PUT needed, on every PR
  catalogue-witnesses:
    needs: [configure]
    if: ${{ inputs.profile != 'none' }}
    name: catalogue witnesses
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: catalogue test without PUTs
        run: just test tlspuffin x86_64-unknown-linux-gnu "" "--test catalogue"
      - name: patches apply where the catalogue says
        run: just run cargo run --quiet -p puffin-build --bin mk_vendor -- check-patches

  catalogue:
    needs: [configure-catalogue]
    if: ${{ needs.configure-catalogue.outputs.matrix != '[]' && needs.configure-catalogue.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure-catalogue.outputs.matrix) }}
    uses: ./.github/workflows/run-catalogue-tests.yml
    with:
      name: ${{ matrix.name }}
      vendor: ${{ matrix.vendor }}
      preset: ${{ matrix.preset }}
      builds: ${{ toJson(matrix.builds) }}

  check:
    needs: [configure]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'check') }}
    uses: ./.github/workflows/run-checks.yml

  unit-tests:
    needs: [configure]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'unit') }}
    name: unit tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: unit test `puffin`
        run: just test puffin x86_64-unknown-linux-gnu "" ""
      - name: unit test `puffin-build`
        run: just test puffin-build x86_64-unknown-linux-gnu "" ""
      - name: unit test `security-claims`
        run: just test security-claims x86_64-unknown-linux-gnu "" ""
      - name: unit test `tlspuffin`
        run: just test tlspuffin x86_64-unknown-linux-gnu "" "--no-default-features"
      - name: unit test `sshpuffin`
        run: |
          set -o pipefail
          just test sshpuffin x86_64-unknown-linux-gnu "" "" 2>&1 | tee sshpuffin-tests.log
          # These tests (sshpuffin/tests/{determinism,traces}.rs) only compile when
          # a PUT of their vendor is built (here libssh0114 and wolfssh150); a missing
          # vendor would silently drop them and still pass.
          .github/scripts/check_sshpuffin_put_tests.sh sshpuffin-tests.log

  # sshpuffin's PUT tests on the latest releases of its vendors (presets.toml `latest`), for
  # single-PUT fuzzing of them. The unit-tests job runs them on the evaluated pair, libssh0114 and
  # wolfssh150, the vendors build.rs builds when the vendor directory has none.
  unit-tests-sshpuffin-latest:
    needs: [configure]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'unit') }}
    name: unit tests (sshpuffin, latest libssh and wolfSSH)
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: build libssh0122 vendor
        uses: ./.github/actions/mk_vendor
        with:
          vendor: "libssh"
          preset: "libssh0122"
          name: "libssh0122"
      - name: build wolfssh160 vendor
        uses: ./.github/actions/mk_vendor
        with:
          vendor: "wolfssh"
          preset: "wolfssh160"
          name: "wolfssh160"
      - name: unit test `sshpuffin`
        run: |
          set -o pipefail
          just test sshpuffin x86_64-unknown-linux-gnu "" "" 2>&1 | tee sshpuffin-tests.log
          # The PUTs the tests ran on: exactly the latest releases, not a fallback build.
          puts=$(grep -h 'rustc-cfg=has_put=' target/x86_64-unknown-linux-gnu/debug/build/sshpuffin-*/output \
                   | sed 's/.*has_put="\(.*\)"/\1/' | sort -u | tr '\n' ' ')
          [[ "$puts" == "libssh0122 wolfssh160 " ]] \
            || { echo "::error::sshpuffin tests ran on '$puts', not libssh0122 and wolfssh160"; exit 1; }
          .github/scripts/check_sshpuffin_put_tests.sh sshpuffin-tests.log

  cli-tlspuffin:
    needs: [configure]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'cli') }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: build OpenSSL dependency
        uses: ./.github/actions/mk_vendor
        with:
          vendor: "openssl"
          preset: "openssl111j"
          name: "openssl111j"
      - name: build `tlspuffin`
        run: just run cargo build --bin tlspuffin --target x86_64-unknown-linux-gnu --profile=release --features=cputs
      - name: run `tlspuffin help`
        run: just run cargo run --bin tlspuffin --target x86_64-unknown-linux-gnu --profile=release --features=cputs -- help
      - name: run `tlspuffin seed`
        run: just run cargo run --bin tlspuffin --target x86_64-unknown-linux-gnu --profile=release --features=cputs -- seed && [[ -d ./seeds ]]
      - name: run `tlspuffin execute` on seeds
        run: just run cargo run --bin tlspuffin --target x86_64-unknown-linux-gnu --profile=release --features=cputs -- execute ./seeds
      - name: run `tlspuffin seed --corpus default`
        run: just run cargo run --bin tlspuffin --target x86_64-unknown-linux-gnu --profile=release --features=cputs -- seed --corpus default && [[ -n "$(ls -A ./seeds)" ]]
      - name: run `tlspuffin seed --corpus vulnerabilities`
        run: just run cargo run --bin tlspuffin --target x86_64-unknown-linux-gnu --profile=release --features=cputs -- seed --corpus vulnerabilities && [[ -n "$(ls -A ./seeds)" ]]

  cli-sshpuffin:
    needs: [configure]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'cli') }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: build `sshpuffin`
        run: just run cargo build --bin sshpuffin --target x86_64-unknown-linux-gnu --profile=release
      - name: run `sshpuffin help`
        run: just run cargo run --bin sshpuffin --target x86_64-unknown-linux-gnu --profile=release -- help
      - name: run `sshpuffin seed`
        run: just run cargo run --bin sshpuffin --target x86_64-unknown-linux-gnu --profile=release -- seed && [[ -d ./seeds ]]
      # On a PUT of each vendor: without `-T`, `execute` only runs the default one (libssh).
      - name: run `sshpuffin execute` on seeds
        run: |
          for put in libssh0114 wolfssh150; do
            just run target/x86_64-unknown-linux-gnu/release/sshpuffin -T "$put" execute ./seeds
          done

  test-tlspuffin:
    needs: [configure]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'test') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.configure.outputs.matrix) }}

    uses: ./.github/workflows/run-tlspuffin-tests.yml
    with:
      name: ${{ matrix.name }}
      vendor: ${{ matrix.mk_vendor.vendor }}
      preset: ${{ matrix.mk_vendor.preset }}

  differential-openssl-wolfssl:
    needs: [configure]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'test') }}
    uses: ./.github/workflows/run-differential-tests.yml
    with:
      name: openssl340-vs-wolfssl580
      first_vendor: openssl
      first_preset: openssl340
      second_vendor: wolfssl
      second_preset: wolfssl580

  differential-openssl-libressl:
    needs: [ configure ]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'test') }}
    uses: ./.github/workflows/run-differential-tests.yml
    with:
      name: openssl340-vs-libressl421
      first_vendor: openssl
      first_preset: openssl340
      second_vendor: libressl
      second_preset: libressl421

  differential-openssl-libressl333:
    needs: [ configure ]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'test') }}
    uses: ./.github/workflows/run-differential-tests.yml
    with:
      name: openssl340-vs-libressl333
      first_vendor: openssl
      first_preset: openssl340
      second_vendor: libressl
      second_preset: libressl333

  differential-openssl-boringssl:
    needs: [ configure ]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'test') }}
    uses: ./.github/workflows/run-differential-tests.yml
    with:
      name: openssl340-vs-boringssl20260508
      first_vendor: openssl
      first_preset: openssl340
      second_vendor: boringssl
      second_preset: boringssl20260508

  # SSH counterpart of the differential-* jobs above. sshpuffin has no `differential`
  # integration test, so the reusable run-differential-tests.yml (a `cargo test -- differential`)
  # cannot be reused as-is; instead this mirrors cli-sshpuffin and asserts 0-diff by looping
  # `differential-execute` over the honest corpus seeds (guards the 0-diff corpus, Exp C).
  differential-sshpuffin:
    needs: [configure]
    if: ${{ contains(fromJson(needs.configure.outputs.checks), 'test') }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: build libssh0114 vendor
        uses: ./.github/actions/mk_vendor
        with:
          vendor: "libssh"
          preset: "libssh0114"
          name: "libssh0114"
      - name: build wolfssh vendor
        uses: ./.github/actions/mk_vendor
        with:
          vendor: "wolfssh"
          preset: "wolfssh150"
          name: "wolfssh150"
      - name: build `sshpuffin`
        run: just run cargo build --bin sshpuffin --target x86_64-unknown-linux-gnu --profile=release
      - name: run `sshpuffin seed`
        run: just run cargo run --bin sshpuffin --target x86_64-unknown-linux-gnu --profile=release -- seed && [[ -d ./seeds ]]
      - name: differential 0-diff on all corpus seeds
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/sshpuffin
          # The size of the default corpus: a seed that disappears must not go unnoticed.
          expected=16
          count=$(ls ./seeds/*.trace | wc -l)
          [[ $count -eq $expected ]] || { echo "::error::$count seeds, expected $expected"; exit 1; }
          fail=0
          for t in ./seeds/*.trace; do
            out=$(just run "$BIN" differential-execute libssh0114 wolfssh150 "$t" 2>/dev/null || true)
            if ! echo "$out" | grep -q "No differences"; then
              echo "UNEXPECTED DIFF in $t:"; echo "$out"; fail=1
            fi
            # "No differences" also holds when both PUTs fail at the same step.
            for put in libssh0114 wolfssh150; do
              just run "$BIN" -T "$put" display-execute --uniformise "$t" >/dev/null 2>&1 \
                || { echo "::error::$t does not succeed on $put"; fail=1; }
            done
          done
          exit $fail
      # Negative control: the differential does see a known bug once it is not shadowed.
      - name: differential reports wolfSSL/wolfssh#1246 without the shadow
        run: |
          BIN=target/x86_64-unknown-linux-gnu/release/sshpuffin
          out=$(SSHPUFFIN_SHADOW_KNOWN_BUGS=0 just run "$BIN" differential-execute libssh0114 wolfssh150 \
                ./seeds/seed_client_attacker_forwarding.trace 2>/dev/null || true)
          if ! echo "$out" | grep -q "response_data"; then
            echo "::error::no REQUEST_SUCCESS difference on the forwarding seed:"; echo "$out"; exit 1
          fi
