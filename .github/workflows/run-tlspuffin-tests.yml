name: run-tlspuffin-tests

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      vendor:
        required: true
        type: string
      preset:
        required: true
        type: string

permissions:
  contents: read

jobs:
  tlspuffin-tests:
    name: ${{ inputs.name }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup

      - name: build vendor library
        uses: ./.github/actions/mk_vendor
        with:
          vendor: "${{ inputs.vendor }}"
          preset: "${{ inputs.preset }}"

      - name: test
        run: just test tlspuffin x86_64-unknown-linux-gnu "cputs" ""
