name: run-checks

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rustfmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: run rustfmt
        run: just fmt-rust-check

  clangfmt:
    name: clang-format
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: run clang-format
        run: just fmt-clang-check

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        uses: ./.github/actions/setup
      - name: check workspace
        run: just check-workspace

  msrv:
    name: msrv
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: setup
        id: setup
        uses: ./.github/actions/setup
      - name: check with MSRV
        run: just check-workspace
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.setup.minrust_toolchain }}
